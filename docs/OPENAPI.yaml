          type: string
          title: Actor Role
        actor_source:
          type: string
          title: Actor Source
        operation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Operation Id
        target_identity:
          anyOf:
          - type: string
          - type: 'null'
          title: Target Identity
        evidence_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Evidence Id
