    AuditEventPageOut:
      properties:
        events:
          items:
            $ref: '#/components/schemas/AuditEventOut'
          type: array
          title: Events
        returned:
          type: integer
          title: Returned
        total_records:
          type: integer
          title: Total Records
        records_predating_chain:
          type: integer
          title: Records Predating Chain
          default: 0
        limit:
          type: integer
          title: Limit
        offset:
          type: integer
          title: Offset
      type: object
      required:
      - events
      - returned
      - total_records
      - limit
      - offset
      title: AuditEventPageOut
      description: 'A page of audit records, oldest first.


        ``total_records`` is the height of the whole log, not the size of this

        page, so a reader can tell a page is a window without inferring it from the

        page happening to be full.'
    AuditLinkOut:
      properties:
        audit_id:
          type: string
          title: Audit Id
        sequence:
          type: integer
          title: Sequence
        status:
          type: string
          title: Status
        detail:
          type: string
          title: Detail
      type: object
      required:
      - audit_id
      - sequence
      - status
      - detail
      title: AuditLinkOut
    AuditVerifyRequest:
      properties:
        operation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Operation Id
      type: object
      title: AuditVerifyRequest
      description: 'Optional narrowing for a verification request.


        Supplying ``operation_id`` narrows which records are examined. It cannot

        make a window look complete: a subset that does not begin at the genesis

        record is reported ``UNVERIFIABLE``, because the chain spans every event in

        the system and a per-operation slice necessarily has history before it.'
    CertificateOut:
      properties:
        id:
          type: string
          title: Id
        operation_id:
          type: string
          title: Operation Id
        evidence_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Evidence Id
        evidence_digest:
          type: string
          title: Evidence Digest
        certificate_version:
          type: string
          title: Certificate Version
        canonicalization_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Canonicalization Version
        evidence_schema_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Evidence Schema Version
        target_identity:
          anyOf:
          - type: string
          - type: 'null'
          title: Target Identity
        method:
          anyOf:
          - type: string
          - type: 'null'
          title: Method
        result:
          anyOf:
          - type: string
          - type: 'null'
          title: Result
        signer_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Signer Id
        signing_algorithm:
          type: string
          title: Signing Algorithm
        key_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Key Id
        public_key:
          type: string
          title: Public Key
        signature:
          type: string
          title: Signature
        claim:
          anyOf:
          - type: string
          - type: 'null'
          title: Claim
        issued_at:
          type: string
          format: date-time
          title: Issued At
        limitations:
          items:
            type: string
          type: array
          title: Limitations
      type: object
      required:
      - id
      - operation_id
      - evidence_digest
      - certificate_version
      - signing_algorithm
      - public_key
      - signature
      - issued_at
      title: CertificateOut
    CertificateVerificationOut:
      properties:
        certificate_id:
          type: string
          title: Certificate Id
        overall_status:
          type: string
          pattern: ^(VALID|INVALID|INCONCLUSIVE)$
          title: Overall Status
          enum:
          - VALID
          - INVALID
          - INCONCLUSIVE
        dimensions:
          items:
            $ref: '#/components/schemas/DimensionResultOut'
          type: array
          title: Dimensions
          minItems: 10
          description: 'Exactly one result per verification dimension. A PASS on SIGNATURE_VALIDITY does not imply
            overall certificate validity: only overall_status does. NOT_CHECKED and INCONCLUSIVE are honest absences
            of evidence and must not be rendered as success.'
        cannot_prove:
          items:
            type: string
          type: array
          title: Cannot Prove
        certificate_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Certificate Version
        verifier_version:
          type: string
          title: Verifier Version
        verified_at:
          type: string
          format: date-time
          title: Verified At
        signature_valid:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Signature Valid
        evidence_integrity:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Evidence Integrity
        signer_trusted:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Signer Trusted
      type: object
      required:
      - certificate_id
      - overall_status
      - dimensions
      - verifier_version
      - verified_at
      title: CertificateVerificationOut
    CertificateVerificationRequest:
      properties:
        expected_operation_id:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Expected Operation Id
          description: The operation the caller believes this certificate attests to. Compared against the certificate
            and its evidence.
        expected_target_identity:
          anyOf:
          - type: string
            maxLength: 1024
          - type: 'null'
          title: Expected Target Identity
          description: The target the caller believes this certificate attests to. Compared against the certificate
            and its evidence.
      additionalProperties: false
      type: object
      title: CertificateVerificationRequest
      description: 'Independent expectations the caller brings to the verification.


        Both are optional. Omitting one is honest - the corresponding dimension

        reports ``NOT_CHECKED`` and the overall result becomes ``INCONCLUSIVE``

        rather than pretending the check succeeded.'
    ConfirmationInput:
      properties:
        acknowledged_risk:
          type: boolean
          title: Acknowledged Risk
          description: Must explicitly acknowledge destructive operation risk
      type: object
      required:
      - acknowledged_risk
      title: ConfirmationInput
    CoverageOut:
      properties:
        residual_analysis:
          $ref: '#/components/schemas/CoverageState'
          default: NOT_PERFORMED
        recovery_test:
          $ref: '#/components/schemas/CoverageState'
          default: NOT_PERFORMED
        recovery_methods:
          $ref: '#/components/schemas/RecoveryMethodCoverageOut'
        residual_scanners:
          $ref: '#/components/schemas/ResidualScannerCoverageOut'
      additionalProperties: false
      type: object
      title: CoverageOut
      description: 'What was actually searched.


        Present so no client ever has to infer coverage from an empty findings list

        or a single boolean.'
    CoverageState:
      type: string
      enum:
      - NOT_PERFORMED
      - UNAVAILABLE
      - INCONCLUSIVE
      - PARTIAL
      - PERFORMED
      title: CoverageState
      description: 'How much of a supported analysis actually ran.


        The distinction between `PARTIAL` and `PERFORMED` is the point: before it

        existed, "one of several recovery methods ran" and "every supported method

        ran" were reported identically, and a client could not tell them apart.'
    CreateOperationRequest:
      properties:
        target_id:
          type: string
          minLength: 1
          title: Target Id
        mode:
          type: string
          pattern: ^(COMPLETE_ERASURE|SELECTIVE_PERMANENT|CONTROLLED_RECOVERABLE)$
          title: Mode
        policy_id:
          type: string
          title: Policy Id
          default: ERASURE.LOGICAL.SELECTIVE.V1
          description: 'Must be an allowlisted backend policy. Currently registered: ERASURE.LOGICAL.SELECTIVE.V1,
            ERASURE.LOGICAL.TREE.V1, ERASURE.RECOVERABLE.ENCRYPTED.V1. The backend rejects any other identifier;
            the frontend must not invent policy identifiers.'
        confirmation:
          $ref: '#/components/schemas/ConfirmationInput'
        recovery:
          anyOf:
          - $ref: '#/components/schemas/RecoveryConfig'
          - type: 'null'
      type: object
      required:
      - target_id
      - mode
      - confirmation
      title: CreateOperationRequest
    DimensionResultOut:
      properties:
        dimension:
          type: string
          title: Dimension
          enum:
          - STRUCTURE
          - VERSION_COMPATIBILITY
          - EVIDENCE_AVAILABILITY
          - EVIDENCE_DIGEST
          - SIGNATURE_VALIDITY
          - PUBLIC_KEY_CONSISTENCY
          - SIGNER_TRUST
          - EVIDENCE_CHAIN_INTEGRITY
          - OPERATION_CONSISTENCY
          - TARGET_CONSISTENCY
        result:
          type: string
          pattern: ^(PASS|FAIL|NOT_CHECKED|INCONCLUSIVE)$
          title: Result
          enum:
          - PASS
          - FAIL
          - NOT_CHECKED
          - INCONCLUSIVE
        detail:
          type: string
          title: Detail
        evidence_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Evidence Ref
      type: object
      required:
      - dimension
      - result
      - detail
      title: DimensionResultOut
    ErrorResponse:
      properties:
        error_code:
          type: string
          title: Error Code
        message:
          type: string
          title: Message
        details:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Details
      type: object
      required:
      - error_code
      - message
      title: ErrorResponse
    EvidenceVerificationRequest:
      properties:
        evidence:
          additionalProperties: true
          type: object
          title: Evidence
        signature:
          type: string
          title: Signature
        public_key:
          type: string
          title: Public Key
      type: object
      required:
      - evidence
      - signature
      - public_key
      title: EvidenceVerificationRequest
    EvidenceVerificationResult:
      properties:
        valid:
          type: boolean
          title: Valid
      type: object
      required:
      - valid
      title: EvidenceVerificationResult
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LoginRequest:
      properties:
        username:
          type: string
          maxLength: 128
          minLength: 1
          title: Username
        password:
          type: string
          maxLength: 256
          minLength: 1
          title: Password
      type: object
      required:
      - username
      - password
      title: LoginRequest
    LoginResponse:
      properties:
        access_token:
          type: string
          title: Access Token
        token_type:
          type: string
          title: Token Type
          default: bearer
        expires_at:
          type: string
          format: date-time
          title: Expires At
        user:
          $ref: '#/components/schemas/UserOut'
      type: object
      required:
      - access_token
      - expires_at
      - user
      title: LoginResponse
    LogoutResponse:
      properties:
        status:
          type: string
          title: Status
          default: COMPLETED
        message:
          type: string
          title: Message
          default: Session successfully terminated
      type: object
      title: LogoutResponse
    OperationEventOut:
      properties:
        id:
          type: string
          title: Id
        operation_id:
          type: string
          title: Operation Id
        sequence:
          type: integer
          title: Sequence
        event_type:
          type: string
          title: Event Type
        from_state:
          anyOf:
          - type: string
          - type: 'null'
          title: From State
        to_state:
          anyOf:
          - type: string
          - type: 'null'
          title: To State
        payload:
          anyOf:
          - type: string
          - type: 'null'
          title: Payload
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - operation_id
      - sequence
      - event_type
      - created_at
      title: OperationEventOut
    OperationOut:
      properties:
        id:
          type: string
          title: Id
        target_id:
          type: string
          title: Target Id
        mode:
          type: string
          title: Mode
        state:
          type: string
          title: State
          description: 'Operation lifecycle state. Authoritative values: CREATED, ANALYZING, PENDING_APPROVAL, READY,
            ERASING, VERIFYING, RECOVERY_TEST, RESIDUAL_SCAN, RESIDUAL_ANALYSIS, ASSESSING, CERTIFYING, RECONCILIATION_REQUIRED,
            COMPLETED, PARTIAL, FAILED, INCONCLUSIVE, CANCELLED. Terminal states: COMPLETED, PARTIAL, FAILED, INCONCLUSIVE,
            CANCELLED. Consumers must render PARTIAL and INCONCLUSIVE as distinct outcomes and must never collapse
            them into success.'
        policy_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Policy Id
        progress_percent:
          type: number
          title: Progress Percent
          default: 0.0
        warnings:
          items:
            type: string
          type: array
          title: Warnings
        error:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Error
        actor_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor Id
        created_at:
          type: string
          format: date-time
          title: Created At
        started_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Started At
        completed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Completed At
      type: object
      required:
      - id
      - target_id
      - mode
      - state
      - created_at
      title: OperationOut
    OperationPageOut:
      properties:
        operations:
          items:
            $ref: '#/components/schemas/OperationOut'
          type: array
          title: Operations
        returned:
          type: integer
          title: Returned
        total:
          type: integer
          title: Total
        limit:
          type: integer
          title: Limit
        offset:
          type: integer
          title: Offset
      type: object
      required:
      - operations
      - returned
      - total
      - limit
      - offset
      title: OperationPageOut
      description: 'A page of persisted operations, newest first.


        ``total`` is the number of operations matching the filter, not the size of

        this page, so a reader can tell a window from the whole set without

        inferring it from the page happening to be full.


        Every row comes from the database. No identifier and no state is

        synthesised here; an operation that does not exist simply does not appear.'
    OperationStateOut:
      type: string
      enum:
      - COMPLETED
      - PARTIAL
      - FAILED
      - INCONCLUSIVE
      - CANCELLED
      title: OperationStateOut
      description: Terminal states an operation can end the pipeline in.
    PipelineResultOut:
      properties:
        operation_id:
          type: string
          title: Operation Id
        target_identity:
          type: string
          title: Target Identity
        final_state:
          $ref: '#/components/schemas/OperationStateOut'
        stages:
          items:
            $ref: '#/components/schemas/PipelineStageOut'
          type: array
          title: Stages
        evidence_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Evidence Id
        evidence_digest:
          anyOf:
          - type: string
          - type: 'null'
          title: Evidence Digest
        certificate_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Certificate Id
        assurance_status:
          anyOf:
          - $ref: '#/components/schemas/AssuranceStatusOut'
          - type: 'null'
        verification_status:
          anyOf:
          - $ref: '#/components/schemas/VerificationStatusOut'
          - type: 'null'
        coverage:
          $ref: '#/components/schemas/CoverageOut'
          description: 'What was actually searched. Read this alongside `assurance_status`: PASSED with PARTIAL
            recovery coverage means no artifacts were found by the methods that ran, not that every method was tried.'
        limitations:
          items:
            type: string
          type: array
          title: Limitations
          description: What this operation did not establish, including recovery methods that were never attempted
            and sanitization that was never performed.
        privilege_isolated:
          type: boolean
          title: Privilege Isolated
          default: false
      additionalProperties: false
      type: object
      required:
      - operation_id
      - target_identity
      - final_state
      - stages
      title: PipelineResultOut
      description: 'The whole run.


        ``certificate_id`` is null whenever issuance was refused or unavailable, and

        the corresponding stage says why. A null certificate is a normal, meaningful

        outcome - it means nothing certifiable was established - and callers must not

        treat it as an error.'
    PipelineStage:
      type: string
      enum:
      - DISCOVER
      - BASELINE
      - RECOMMEND
      - AUTHORIZE
      - ERASE
      - VALIDATE
      - TEST_RECOVERY
      - ANALYZE_RESIDUALS
      - ASSESS_ASSURANCE
      - GENERATE_EVIDENCE
      - ISSUE_CERTIFICATE
      - VERIFY_CERTIFICATE
      title: PipelineStage
      description: The closed loop, in order. Mirrors ``core.pipeline.Stage``.
    PipelineStageOut:
      properties:
        stage:
          $ref: '#/components/schemas/PipelineStage'
        status:
          $ref: '#/components/schemas/PipelineStageStatus'
        detail:
          type: string
          title: Detail
          description: Why the stage ended as it did. Human-readable; never the only machine-readable signal - use
            `status`.
      additionalProperties: false
      type: object
      required:
      - stage
      - status
      - detail
      title: PipelineStageOut
      description: One stage, and what it established.
    PipelineStageStatus:
      type: string
      enum:
      - COMPLETED
      - REFUSED
      - FAILED
      - UNAVAILABLE
      - SKIPPED
      title: PipelineStageStatus
      description: 'How a stage ended.


        ``SKIPPED`` and ``UNAVAILABLE`` are distinct on the wire for the same reason

        they are distinct internally: chosen not to run, versus tried and could not.'
    RecoveryConfig:
      properties:
        retention_seconds:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Retention Seconds
          default: 86400
      type: object
      title: RecoveryConfig
    RecoveryMethodCoverageOut:
      properties:
        supported:
          items:
            type: string
          type: array
          title: Supported
          description: Methods this build can perform at all.
        attempted:
          items:
            type: string
          type: array
          title: Attempted
        successful:
          items:
            type: string
          type: array
          title: Successful
          description: Methods that recovered the data. Non-empty means recoverable.
        failed:
          items:
            type: string
          type: array
          title: Failed
          description: Methods that ran and did not recover the data. Evidence about those methods only - never
            evidence of irrecoverability.
        unavailable:
          items:
            type: string
          type: array
          title: Unavailable
          description: Methods never attempted, because this build cannot perform them.
      additionalProperties: false
      type: object
      title: RecoveryMethodCoverageOut
      description: 'Which recovery methods ran, and what each one did.


        Named lists rather than counts, so a client can render exactly which

        techniques were and were not applied instead of inferring it.'
    RecoveryObjectOut:
      properties:
        id:
          type: string
          title: Id
        operation_id:
          type: string
          title: Operation Id
        status:
          type: string
          title: Status
          default: SEALED
        original_sha256:
          type: string
          title: Original Sha256
        original_size:
          anyOf:
          - type: integer
          - type: 'null'
          title: Original Size
        created_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Created At
        expires_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Expires At
      type: object
      required:
      - id
      - operation_id
      - original_sha256
      title: RecoveryObjectOut
    ResidualScannerCoverageOut:
      properties:
        supported:
          items:
            type: string
          type: array
          title: Supported
        ran:
          items:
            type: string
          type: array
          title: Ran
        inconclusive:
          items:
            type: string
          type: array
          title: Inconclusive
        unavailable:
          items:
            type: string
          type: array
          title: Unavailable
      additionalProperties: false
      type: object
      title: ResidualScannerCoverageOut
      description: Which residual scanners ran.
    RestoreRequest:
      properties:
        destination:
          type: string
          maxLength: 1024
          minLength: 1
          title: Destination
        allow_overwrite:
          type: boolean
          title: Allow Overwrite
          description: Explicit consent flag required to overwrite an existing destination file
          default: false
      type: object
      required:
      - destination
      title: RestoreRequest
    RestoreResponse:
      properties:
        status:
          type: string
          title: Status
        destination:
          type: string
          title: Destination
        sha256:
          type: string
          title: Sha256
        integrity_verified:
          type: boolean
          title: Integrity Verified
      type: object
      required:
      - status
      - destination
      - sha256
      - integrity_verified
      title: RestoreResponse
    TargetAnalyzeRequest:
      properties:
        path:
          type: string
          maxLength: 1024
          minLength: 1
          title: Path
        include_content_analysis:
          type: boolean
          title: Include Content Analysis
          default: false
      type: object
      required:
      - path
      title: TargetAnalyzeRequest
      description: Request to analyze a target.
    TargetOut:
      properties:
        id:
          type: string
          title: Id
        path:
          type: string
          title: Path
        canonical_path:
          type: string
          title: Canonical Path
        target_type:
          type: string
          title: Target Type
        file_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: File Count
        total_size:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total Size
        sha256:
          anyOf:
          - type: string
          - type: 'null'
          title: Sha256
        discovered_at:
          type: string
          format: date-time
          title: Discovered At
      type: object
      required:
      - id
      - path
      - canonical_path
      - target_type
      - discovered_at
      title: TargetOut
    TargetProfile:
      properties:
        id:
          type: string
          title: Id
        path:
          type: string
          title: Path
        canonical_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Canonical Path
        type:
          type: string
          title: Type
        size_bytes:
          type: integer
          title: Size Bytes
          default: 0
        file_count:
          type: integer
          title: File Count
          default: 0
        sha256:
          anyOf:
          - type: string
          - type: 'null'
          title: Sha256
        storage_profile:
          additionalProperties: true
          type: object
          title: Storage Profile
        sensitivity:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Sensitivity
        warnings:
          items:
            type: string
          type: array
          title: Warnings
        errors:
          items:
            type: string
          type: array
          title: Errors
      type: object
      required:
      - id
      - path
      - type
      title: TargetProfile
      description: Profile of analyzed target.
    UserOut:
      properties:
        id:
          type: string
          title: Id
        username:
          type: string
          title: Username
        roles:
          items:
            type: string
          type: array
          title: Roles
        permissions:
          items:
            type: string
          type: array
          title: Permissions
        disabled:
          type: boolean
          title: Disabled
